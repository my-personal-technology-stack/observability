# Grafana datasource provisioning configuration.
apiVersion: 1

datasources:
  # Prometheus provides time-series metrics.
  - name: Prometheus
    uid: prometheus
    type: prometheus

    # Query Prometheus from the Grafana server over the Compose network.
    access: proxy
    url: http://prometheus:9090

    # Make Prometheus the default datasource for new panels.
    isDefault: true

    # Allow datasource settings to be edited from the Grafana UI.
    editable: true